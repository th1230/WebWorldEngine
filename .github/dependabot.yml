# 只盯一件事：`three` 動了沒有。
#
# ## 為什麼只有它
#
# `packages/three` 把 `three` 的 peer 鎖在**一個 minor**
# （`>=0.185.0 <0.186.0`），而那不是保守，是必要的：`three-internals.ts`
# 碰 `THREE.BatchedMesh` 的私有欄位，因為官方沒有公開的替代路徑。
#
# 那個鎖有兩面：
#
# - 好的一面：不相容的 Three 裝不進來
# - 壞的一面：**Three 每出一個 minor，這個套件就自動變成裝不起來**，
#   而在這個 repo 裡完全沒有徵兆 —— 沒有人升級，就沒有人發現
#
# ## 為什麼其他的不盯
#
# 第一版打開全部之後它一次開了七個 PR，其中三個是 devDependency 的 major
# （typescript 6、vite-plugin-dts 5、rapier 0.20）。那些不是「上游動了要有人
# 知道」，是**待辦事項**，而待辦事項不該用 PR 的形式堆在那裡等人關掉。
#
# 這個 repo 的相依全部鎖住版本，而且有二十七道關卡守著行為。要升級的時候
# 主動跑 `pnpm outdated` 就好 —— 那是一個決定，不是一則通知。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 一次最多一個。這裡只會有 `three`。
    open-pull-requests-limit: 1
    allow:
      - dependency-name: three
    # 收到之後要做的事只有一件：跑 `pnpm verify:all`。二十七道關卡是拿原生
    # Three 當對照組量的，所以它們就是「這一版還能不能用」的答案。
    commit-message:
      prefix: 'chore(deps)'
