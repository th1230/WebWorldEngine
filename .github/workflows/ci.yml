name: CI

# 平常在 `develop` 上做事；`main` 只收合併，而合併到 `main` 會觸發發布
# （見 `release.yml`）。兩條都要跑 —— `main` 上跑是因為**發布前最後一次**
# 驗證要在真的要發的那個 commit 上。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # ## 每週跑一次，即使沒有人改任何東西
  #
  # 這個套件碰 `THREE.BatchedMesh` 的私有欄位（見 `three-internals.ts`：
  # 官方沒有公開的替代路徑）。Three 改名或改結構的話，這裡會**靜靜地**
  # **畫不出東西** —— 而 peer 範圍鎖在一個 minor，所以那件事只會在有人
  # 升級 Three 時發生，而不是在有人改這個 repo 時。
  #
  # 排程跑配上 Dependabot 的 PR，就是「上游動了」這件事的偵測器。
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# 這個 workflow 只讀。沒有這一段的話拿到的是 repo 的預設值，而新 repo
# 的預設是 contents: write —— 一個只跑測試的 job 不需要那個。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # cooked 資產是 build 與 benchmark 的輸入，必須先產生。
      # --verify 同時驗證可重現性：相同輸入必須得到相同雜湊。
      - run: pnpm cook -- --verify

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # 格式在本機是 `pnpm verify` 的一部分，CI 以前卻沒有跑 —— 於是
      # 「本機過了」與「CI 過了」不是同一件事，而那種落差只會愈拉愈大。
      - run: pnpm format:check

      # npm 頁面上看得到的欄位。壞掉在這個 repo 裡沒有任何徵兆，
      # 要等到發布之後從 npmjs.com 上看才發現。
      - run: pnpm metadata-check

      # README 裡每一個 WW.something 都是一句沒有人守的宣稱。改名之後
      # 文件那一行從此是錯的，而打擊的是還沒上手的人 —— 他照著寫、拿到
      # undefined is not a function，然後合理地推論這個套件是壞的。
      - run: pnpm docs-check

      # 產出必須真的建得起來；只做型別檢查抓不到 bundler 層的問題
      - run: pnpm build

      # 發布路徑要在 CI 走過一遍。工作區裡 `exports` 直指 src，所以
      # **只跑測試完全碰不到 dist** —— 打包壞掉要等到有人 npm install 才知道。
      - run: pnpm build:pkg

      # 只用 WebGL 的人不該下載 WebGPU 那一半。套件裡十幾處寫著「所以這裡用
      # 動態 import」，而在這道關卡之前**沒有任何東西守著那句話** —— 改成
      # 靜態 import 的話 typecheck、lint、單元測試、所有畫面關卡全部照樣綠，
      # 因為畫面完全正確，只是每個使用者多背一整包 TSL。
      # 生態系自己的兩把尺：publint 驗 package.json 與 tarball，
      # attw 驗型別在四種解析模式下找不找得到。它們第一次跑就抓到
      # @web-world-engine/cook 的型別整個是斷的 —— 而這裡沒有任何東西看得見。
      - run: pnpm publish-check

      - run: pnpm bundle-check

      # package-check 的最後一段會把套件打包成一個網站並在瀏覽器裡跑，
      # 所以這個 job 也需要瀏覽器。
      - run: pnpm exec playwright install --with-deps chromium

      # 打包 → 裝進一個乾淨的專案 → import → 真的跑一次 cook → 再打包成
      # 網站在瀏覽器裡跑一次。這是唯一會用到「使用者那一側」規則的檢查：
      # peerDependency、publishConfig、兩個套件的格式版本一不一致，以及
      # worker 在**只有打包產出**的網站上起不起得來。
      - run: node tools/package-check/verify.mjs

      # 網站的指標：首次可見、下載量、記憶體、與頁面其他內容共存。
      # 幀率量不到這四件事，而它們才是網站上會被感覺到的東西。
      - run: node tools/site-check/verify.mjs

  smoke:
    name: Benchmark smoke (SwiftShader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm cook

      - run: pnpm exec playwright install --with-deps chromium

      # 這一步**不驗證效能**。CI 跑的是無頭 SwiftShader 軟體 adapter，
      # 數字毫無意義。它驗證的是：每個場景都跑得完、沒有頁面錯誤、
      # capability 有正確降級、場景自我檢查通過。
      #
      # 注意涵蓋範圍的缺口：SwiftShader 實測落到 WebGL2，所以
      # compute、indirect draw 與真實 device loss 這些 WebGPU 專屬路徑
      # **不會**被 CI 覆蓋，只能靠開發機的 `pnpm bench` 驗證。
      - run: pnpm bench:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: benchmarks/results/smoke/
          retention-days: 14
