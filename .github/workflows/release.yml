name: Release

# ## 合併回 `main` 就是「發布」這個決定
#
# 平常在 `develop` 上做事，CI 一樣跑。要發一版的時候：在 `develop` 上
# 跑 `pnpm version:set`、寫 CHANGELOG，然後開 PR 合併回 `main`。
#
# **合併本身不會重複發布。** 下面那一步會先問 registry 有沒有這個版本，
# 有就跳過 —— 所以合併十次而版本沒動，就是十次什麼都不發。真正決定
# 發不發的是 `package.json` 裡的版本號有沒有變。
on:
  push:
    branches: [main]
  # 發布做到一半失敗時，修完可以手動再跑一次（已發布的那幾個會跳過）。
  workflow_dispatch:

# 同時推兩個 tag 的話兩個 job 會搶著發同一個 scope。這裡**不取消**
# 進行中的那個 —— 發布做到一半被砍掉會留下「format 上去了、three 沒有」
# 的狀態，比排隊等它跑完糟得多。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      # 發完之後要打 tag，所以是 write。CI 那個只讀。
      contents: write
      # ## Trusted Publishing（OIDC）用的
      #
      # pnpm 每次發布都會**先試 OIDC**，失敗才退回 `NODE_AUTH_TOKEN`。
      # 0.1.0 那一次的 log 是：
      #
      #   Skipped OIDC: ERR_PNPM_AUTH_TOKEN_EXCHANGE:
      #   Failed token exchange request ... (status code 404)
      #
      # 404 是因為 npmjs.com 上還沒替這三個套件設定 Trusted Publishing。
      # 設定之後 OIDC 那條路會通，而**provenance 是跟著它來的** ——
      # 那份 sigstore 簽章把 tarball 綁到確切的 commit 與 workflow run，
      # 擋的是「有人拿到 token 之後從自己的機器發一版」。
      #
      # 設定之後 `NPM_TOKEN` 那個 secret 就可以刪掉了。
      #
      # **0.1.0 沒有 provenance。** 第一版發的時候我在這裡設了
      # `NPM_CONFIG_PROVENANCE: "true"`，而 `pnpm publish` 根本不讀那個
      # 環境變數（它的 `--help` 裡沒有 provenance 這個旗標）。發布成功、
      # workflow 全綠、而那件事沒有發生 —— 一個沒有量過的機制描述，
      # doctrine 第 21 條。已經拿掉，改成寫真正的路。
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # ## 要發哪一版，由 `package.json` 說了算
      #
      # 三個必須一致 —— 不一致的話發出去就是「cook 是 0.2.0、runtime 是
      # 0.1.0」，而那種組合的症狀是資產載不進去。`metadata-check` 也守這
      # 一條，這裡再擋一次是因為**後面那一步不可逆**。
      - name: 決定版本
        id: version
        run: |
          VERSION=$(node -p "require('./packages/three/package.json').version")
          for pkg in format cook; do
            OTHER=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$VERSION" != "$OTHER" ]; then
              echo "三個套件版本不一致：three=$VERSION、$pkg=$OTHER"
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "三個套件都是 $VERSION"

      # ## 這裡**不驗證**
      #
      # 驗證是 `ci.yml` 的職責，而它在往 `main` 的那個 PR 上跑過了 ——
      # GitHub 的 `pull_request` 事件測的就是合併後的樹。到了這裡，
      # 「對不對」已經有答案了。
      #
      # 先前這裡從頭又跑一遍（typecheck、lint、test、六道關卡）。那不是多
      # 一層保險，是**兩個地方各自宣稱自己守著同一件事** —— 而其中一個一定
      # 會先漂走。職責重疊比職責缺漏更難查，因為兩邊看起來都在做事。
      #
      # ⚠️ 這個分工靠的是「PR 沒過 CI 就合併不了」，而那是 GitHub 的**分支
      #    保護設定**，不是 workflow 寫得出來的。`main` 上要開
      #    「Require status checks to pass」並勾選 CI 的兩個 job。沒開的話，
      #    直接推 `main` 就會發布沒驗過的東西。
      #
      # 這一步是**建置**不是驗證：發出去的 dist 要在這裡產生。
      - run: pnpm build:pkg


      # 依相依順序發。format 先上去，另外兩個才解析得到它。
      # ## dist-tag 要從版本號推出來
      #
      # `npm publish` 不看版本號裡有沒有 prerelease 標記 —— 沒給 `--tag`
      # 一律寫進 `latest`。而 `pnpm version:set` 是**收 `0.2.0-beta.1` 的**，
      # 所以這條路真的走得到：推一個 beta，全世界 `npm i` 的預設就變成它。
      #
      # 規則：`1.2.3` → latest，`1.2.3-beta.1` → beta，`1.2.3-rc.2` → rc。
      - name: 決定 dist-tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          case "$VERSION" in
            *-*) DIST="${VERSION#*-}"; DIST="${DIST%%.*}" ;;
            *)   DIST="latest" ;;
          esac
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
          echo "$VERSION → dist-tag $DIST"
      # ## 有沒有真的發出去，要記下來
      #
      # 這一步在「版本沒動」時什麼都不做（三個都已經在 registry 上）。
      # 下面打 tag 那一步必須知道這件事 —— 沒發布卻去打 tag，就是第一次
      # 合併 PR 之後那個 `v0.1.0 already exists` 的紅線。
      - name: Publish
        id: publish
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          PUBLISHED=false
          for pkg in format three cook; do
            if npm view "@web-world-engine/$pkg@$VERSION" version > /dev/null 2>&1; then
              echo "@web-world-engine/$pkg@$VERSION 已經在 registry 上了，跳過"
              continue
            fi
            pnpm --filter "@web-world-engine/$pkg" publish \
              --no-git-checks --access public --tag "${{ steps.tag.outputs.dist }}"
            PUBLISHED=true
          done
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" = "false" ]; then
            echo "版本沒動，這一次沒有發布任何東西。"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ## 發完之後補上 tag
      #
      # 觸發是「合併到 main」，所以 npm 上的版本沒有東西對得回一個 commit。
      # 這一步把它補回來：`v0.2.0` 指著實際發布的那一次合併。
      #
      # **只在真的發布了才跑。** 第一版踩過兩次：
      #
      # 1. 版本沒動的合併也去打 tag，而 tag 已經存在 → push 被拒、job 紅
      # 2. 那個「已經存在就跳過」用的是 `git rev-parse`，查的是**本地** ——
      #    而 `actions/checkout` 預設不抓 tag，所以本地永遠查不到，每次都
      #    重建、每次都被遠端拒絕
      #
      # 現在兩邊都修：沒發布就不跑，要跑也是問遠端。
      - name: 打 tag
        if: steps.publish.outputs.published == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "v$VERSION 在遠端已經存在，跳過"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
